name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "RELEASE.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/RELEASE.') }}

jobs:
  detect-go-changes:
    name: Detect Go code changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.filter.outputs.go_changed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Go changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Master and RELEASE tags always run the full pipeline.
          if [[ "$REF" == "refs/heads/master" || "$REF" == refs/tags/RELEASE.* ]]; then
            echo "master or RELEASE tag: always run"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" ]]; then
            if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              git fetch origin "$BASE_SHA" --depth=1 || true
            fi
            files="$(git diff --name-only "$BASE_SHA"...HEAD -- || true)"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              # New branch with no history to diff: run to be safe.
              echo "no base to diff (new branch): always run"
              echo "go_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- || true)"
          else
            # Unknown trigger: run to be safe.
            echo "unknown trigger: always run"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          if printf '%s\n' "$files" | grep -Eq '(^|/)[^ ]*\.(go|sh|yml|yaml)$|(^|/)go\.(mod|sum)$'; then
            echo "Go/build changes detected"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Go/build changes"
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build and run unit tests
        run: |
          go build --ldflags="-s -w" .
          go test -v -race --timeout 30m ./...

  vulncheck:
    name: Vulnerability analysis
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  build-linux-amd64-for-integration:
    name: Build Linux AMD64 integration binary
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux AMD64 binary
        run: .github/scripts/build-linux-amd64.sh mc-linux-amd64

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v7
        with:
          name: mc-linux-amd64-${{ github.run_id }}
          path: mc-linux-amd64
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  integration:
    name: Integration tests with ${{ matrix.backend }}
    needs: [detect-go-changes, unit, vulncheck, build-linux-amd64-for-integration]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [minio-legacy, rustfs, garage, seaweedfs, versitygw, aistor]
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-amd64-${{ github.run_id }}
          path: .integration

      - name: Install Linux binary
        run: install -m 0755 .integration/mc-linux-amd64 mc

      - name: Run integration tests
        env:
          AISTOR_LICENSE: ${{ secrets.AISTOR_LICENSE }}
        run: .github/scripts/run-integration-tests.sh "${{ matrix.backend }}" "$GITHUB_WORKSPACE/mc"

  goreleaser:
    name: Build release artifacts with Goreleaser
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/RELEASE.'))
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot artifacts on master
        if: github.ref == 'refs/heads/master'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Build tagged artifacts
        if: startsWith(github.ref, 'refs/tags/RELEASE.')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish --skip=validate

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: mc-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/RELEASE.')
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-dist-${{ github.run_id }}
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail

          # Stage binaries without a version part in the filename.
          # Goreleaser may still emit versioned paths/names, so derive a
          # stable asset name per platform instead of reusing .name.
          rm -rf release-assets
          mkdir -p release-assets

          while IFS=$'\t' read -r path goos goarch; do
            [[ -n "$path" && -n "$goos" && -n "$goarch" ]]

            name="mc-${goos}-${goarch}"
            if [[ "$goos" == "windows" ]]; then
              name="${name}.exe"
            fi

            cp -- "$path" "release-assets/$name"
          done < <(
            jq -r '
              .[]
              | select(.type == "Binary" and .extra.Format == "binary")
              | [.path, .goos, .goarch]
              | @tsv
            ' dist/artifacts.json
          )

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

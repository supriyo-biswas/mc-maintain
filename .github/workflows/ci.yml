name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "RELEASE.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/RELEASE.') }}

jobs:
  unit:
    name: Unit tests on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build and run unit tests
        run: |
          go build --ldflags="-s -w" .
          go test -v -race --timeout 30m ./...

  vulncheck:
    name: Vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  build-linux-amd64-for-integration:
    name: Build Linux AMD64 integration binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux AMD64 binary
        run: .github/scripts/build-linux-amd64.sh mc-linux-amd64

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v7
        with:
          name: mc-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: mc-linux-amd64
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration tests with ${{ matrix.backend }}
    needs: [unit, vulncheck, build-linux-amd64-for-integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [minio, rustfs, garage, seaweedfs]
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .integration

      - name: Install Linux binary
        run: install -m 0755 .integration/mc-linux-amd64 mc

      - name: Run integration tests
        run: .github/scripts/run-integration-tests.sh "${{ matrix.backend }}" "$GITHUB_WORKSPACE/mc"

  goreleaser:
    name: Build release artifacts with Goreleaser
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/RELEASE.'))
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot artifacts on master
        if: github.ref == 'refs/heads/master'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Build tagged artifacts
        if: startsWith(github.ref, 'refs/tags/RELEASE.')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish --skip=validate

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: mc-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/RELEASE.')
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          repository="$GITHUB_REPOSITORY"
          release_id="$(gh api "repos/$repository/releases/tags/$tag" --jq '.id' 2>/dev/null || true)"

          if [[ -z "$release_id" ]]; then
            release_id="$(gh api \
              --method POST \
              "repos/$repository/releases" \
              -f "tag_name=$tag" \
              -f "name=Version $tag" \
              -F generate_release_notes=true \
              --jq '.id')"
          fi

          upload_asset() {
            local file="$1"
            local name="$2"

            existing_id="$(gh api \
              "repos/$repository/releases/$release_id/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv' \
              | awk -F '\t' -v asset_name="$name" '$2 == asset_name { print $1; exit }')"

            if [[ -n "$existing_id" ]]; then
              gh api --method DELETE "repos/$repository/releases/assets/$existing_id"
            fi

            encoded_name="$(jq -rn --arg asset_name "$name" '$asset_name | @uri')"
            gh api \
              --method POST \
              -H 'Content-Type: application/octet-stream' \
              "repos/$repository/releases/$release_id/assets?name=$encoded_name" \
              --input "$file" >/dev/null
          }

          # Stage binaries without a version part in the filename.
          # Goreleaser may still emit versioned paths/names, so derive a
          # stable asset name per platform instead of reusing .name.
          rm -rf release-assets
          mkdir -p release-assets

          while IFS=$'\t' read -r path goos goarch; do
            [[ -n "$path" && -n "$goos" && -n "$goarch" ]]

            name="mc-${goos}-${goarch}"
            if [[ "$goos" == "windows" ]]; then
              name="${name}.exe"
            fi

            cp -- "$path" "release-assets/$name"
          done < <(
            jq -r '
              .[]
              | select(.type == "Binary" and .extra.Format == "binary")
              | [.path, .goos, .goarch]
              | @tsv
            ' dist/artifacts.json
          )

          for file in release-assets/*; do
            upload_asset "$file" "$(basename "$file")"
          done
